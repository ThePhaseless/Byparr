services:
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    # environment:
    #   LOG_LEVEL: debug
    build:
      context: .
      dockerfile: Dockerfile
      shm_size: "1gb"
    # Recommended to offload disk operations to RAM and reduce disk wear:
      tmpfs:
        - /tmp:exec,mode=1777,size=1G
        - /cache:mode=1777,size=512M
    # Uncomment below to use byparr outside of internal network
    # ports:
    #   - "8191:8191"
