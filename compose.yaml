services:
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    # environment:
    #   LOG_LEVEL: debug
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: "1gb"
    # Recommended to offload disk operations to RAM and reduce disk wear.
    # Leave /cache on the image: it holds the baked-in browser.
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    # Uncomment below to use byparr outside of internal network
    # ports:
    #   - "8191:8191"
